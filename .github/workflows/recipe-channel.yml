name: Publish recipe channel

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meal-concierge-recipe-channel
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'recipes-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Publisher code always comes from reviewed main, never the release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - run: python -m pip install -r runtime-requirements.txt
      - name: Verify published archive, then update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recipe_channel_publish.py
