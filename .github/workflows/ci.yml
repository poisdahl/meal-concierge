name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meal-concierge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Meal Concierge CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install pinned test dependencies in an unseeded environment
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/meal-concierge-tests"
          python -m pip --python "$RUNNER_TEMP/meal-concierge-tests/bin/python" install -r tests/mcp-requirements.txt
      - name: Synthetic regression suite
        run: '"$RUNNER_TEMP/meal-concierge-tests/bin/python" -I -B -m unittest discover -s tests -p "test_*.py"'
      - name: Real MCP transport with synthetic store
        run: '"$RUNNER_TEMP/meal-concierge-tests/bin/python" -I -B tests/test_mcp_runtime.py'
